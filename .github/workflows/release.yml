name: Release

# Push a tag matching the version in pyproject.toml, e.g.:
#   uv version --bump minor && git commit -am "Release 0.2.0" && git tag v0.2.0 && git push --follow-tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check tag matches pyproject version
        shell: bash
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Run tests
        run: uv run pytest -q

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build app and installer
        run: uv run python scripts/build.py --build-number ${{ github.run_number }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pol-Tax_*.exe
          generate_release_notes: true
